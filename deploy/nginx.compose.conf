# Used by Docker Compose only. Ingress does this split when the site runs
# on Kubernetes, so the web Pod there stays a plain file server.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Photos are a separate mount at /photos. Nesting that mount inside
  # the read-only html directory makes Docker unable to create the folder.
  location /photos/ {
    root /;
    try_files $uri =404;
    add_header cache-control "public, max-age=3600";
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
