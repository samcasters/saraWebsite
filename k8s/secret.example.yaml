# Secret, example only. Apply the real one with scripts/create-secret.sh.
# Do not put a real password in this file. Git keeps the shape, the cluster keeps the value.
# Look: microk8s kubectl get secret -n sara sara-secret
apiVersion: v1
kind: Secret
metadata:
  name: sara-secret
  namespace: sara
type: Opaque
stringData:
  NEO4J_PASSWORD: CHANGEME
  NEO4J_AUTH: neo4j/CHANGEME
