# ConfigMap. Idea: settings you could say out loud. The password is not here.
# Look: microk8s kubectl describe configmap -n sara sara-config
apiVersion: v1
kind: ConfigMap
metadata:
  name: sara-config
  namespace: sara
data:
  NEO4J_URI: bolt://neo4j.sara.svc.cluster.local:7687
  NEO4J_USER: neo4j
  HOUSE_NAME: Sara's house
  TZ: Europe/Brussels
