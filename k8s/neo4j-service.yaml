# Service, headless. Idea: a StatefulSet uses a Service with clusterIP None
# so the Pod keeps a stable DNS name: neo4j-0.neo4j.sara.svc.cluster.local.
# Look: microk8s kubectl get svc -n sara neo4j
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: sara
spec:
  clusterIP: None
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
