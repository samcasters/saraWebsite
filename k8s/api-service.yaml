# Service. Idea: other Pods call http://api.sara.svc.cluster.local/ and
# do not need the API Pod's changing address.
# Look: microk8s kubectl get svc -n sara api
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sara
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
