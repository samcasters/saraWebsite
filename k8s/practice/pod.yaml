# Practice Pod. A Pod is the smallest thing Kubernetes runs.
# Its IP is on the virtual network, not on the house LAN.
# Deleted once the real website is running.
# Look: microk8s kubectl get pod -n sara practice-web -o wide
apiVersion: v1
kind: Pod
metadata:
  name: practice-web
  namespace: sara
  labels:
    app: practice-web
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 64Mi
