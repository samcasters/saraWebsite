# The three parts of the site, composed onto this machine's Docker engine.
# The Kubernetes node runs the same three parts from k8s/*.yaml.
# Run one of the two, not both: Neo4j is the heavy piece.
#
#   ~/k8s/cluster compose up -d
#   ~/k8s/cluster compose ps
#   ~/k8s/cluster compose down
#
# The site is then at http://127.0.0.1:8080/
name: sara

services:
  neo4j:
    image: neo4j:5.26.32-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_db_temporal_timezone: Europe/Brussels
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError"
    volumes:
      - /mnt/sara-usb/compose/neo4j:/data
    mem_limit: 1536m
    networks:
      - sara
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/7687'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ./api:/app
    environment:
      PORT: "3000"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      TZ: Europe/Brussels
    depends_on:
      neo4j:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - sara

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./content/photos:/photos:ro
      - ./deploy/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    mem_limit: 64m
    networks:
      - sara

networks:
  sara:
    name: sara
